name = "secondwind-gateway"
main = "dist/worker.js"
no_bundle = true
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The only application Worker. Existing payment secrets remain configured on it:
# X402_PAY_TO and CDP_FACILITATOR_KEY. Deployments must never recreate or print them.

[[worker_loaders]]
binding = "LOADER"

[[d1_databases]]
binding = "SW_DB"
database_name = "second-wind-catalog"
database_id = "db6412e2-4c9d-4b82-a93e-3b9f3708245d"

[[r2_buckets]]
binding = "PAYLOADS"
bucket_name = "secondwind-payloads"

[[r2_buckets]]
binding = "DELIVERIES"
bucket_name = "secondwind-deliveries"

[vars]
X402_NETWORK = "eip155:8453"
CANONICAL_ORIGIN = "https://secondwindai.com"

[secrets]
required = ["X402_PAY_TO", "CDP_FACILITATOR_KEY"]

[version_metadata]
binding = "CF_VERSION_METADATA"
