name: Revert this session
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  revert-session:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/proportional-product-scope'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: second-wind-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: workers/gateway
      - name: Revert only verified unused session additions
        working-directory: workers/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/revert-session.mjs
