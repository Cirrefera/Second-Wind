name: Deploy Second Wind
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Dispatch accepts a branch in GitHub's UI/API; only this repository's main
    # may enter the production job or obtain its environment-scoped credentials.
    if: >-
      github.repository == 'Cirrefera/Second-Wind' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://secondwindai.com
    # Keep rejected feature-branch dispatches out of the production queue.
    # Do not interrupt a release between its migrations and acceptance checks.
    concurrency:
      group: second-wind-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/gateway/package-lock.json
      - name: Install locked Pages dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked gateway dependencies and deployment tools
        working-directory: workers/gateway
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test legacy utilities and actual Pages ingress
        run: npm run selftest
      - name: Test release acceptance failure paths
        run: npm run test:release
      - name: Test the gateway commerce implementation
        working-directory: workers/gateway
        run: npm test
      - name: Test actual isolated Dynamic Worker runtime
        working-directory: workers/gateway
        run: npm run test:dynamic-worker
      - name: Build the application Worker
        working-directory: workers/gateway
        run: npm run build
      - name: Build the Pages ingress
        run: npm run build:worker
      - name: Validate release acceptance inputs before deployment
        env:
          # Independent operator-reviewed expectation; never inferred from discovery.
          X402_EXPECTED_PAY_TO: ${{ secrets.X402_EXPECTED_PAY_TO }}
        run: node scripts/release-acceptance.mjs --check-inputs
      - name: Apply the additive commerce schema
        working-directory: workers/gateway
        # This exact idempotent file extends the existing live items/payments
        # database. Never run the historical root migration on production.
        run: ./node_modules/.bin/wrangler d1 execute second-wind-catalog --remote --file=migrations/0001_commerce_repair.sql
      - name: Apply transactional business event outbox
        working-directory: workers/gateway
        run: ./node_modules/.bin/wrangler d1 execute second-wind-catalog --remote --file=migrations/0002_business_outbox.sql
      - name: Apply component trial schema
        working-directory: workers/gateway
        run: ./node_modules/.bin/wrangler d1 execute second-wind-catalog --remote --file=migrations/0003_component_trials.sql
      - name: Apply versioned routing manifest schema
        working-directory: workers/gateway
        run: ./node_modules/.bin/wrangler d1 execute second-wind-catalog --remote --file=migrations/0004_routing_manifests.sql
      - name: Apply recoverable trial request identities
        working-directory: workers/gateway
        run: ./node_modules/.bin/wrangler d1 execute second-wind-catalog --remote --file=migrations/0005_trial_recovery.sql
      - name: Apply paid trial links
        working-directory: workers/gateway
        run: ./node_modules/.bin/wrangler d1 execute second-wind-catalog --remote --file=migrations/0006_trial_payments.sql
      - name: Deploy the application Worker first
        working-directory: workers/gateway
        # Wrangler preserves existing encrypted secrets. Required secret names
        # are declared in wrangler.toml; values never enter this workflow.
        run: ./node_modules/.bin/wrangler deploy --tag "$GITHUB_SHA"
      - name: Deploy Pages with the private gateway binding
        run: ./workers/gateway/node_modules/.bin/wrangler pages deploy public --project-name=second-wind --branch=main --commit-hash "$GITHUB_SHA"
      - name: Accept the deployed production release
        env:
          X402_EXPECTED_PAY_TO: ${{ secrets.X402_EXPECTED_PAY_TO }}
        # Read-only Pages identity and custom-domain health/readiness/discovery.
        # A failed check fails this release; it never creates a purchase or rolls back automatically.
        run: npm run accept:release
